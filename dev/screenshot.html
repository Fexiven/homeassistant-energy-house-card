<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
energy-house-card{display:block;margin:0}
</style></head><body>
<energy-house-card id="c"></energy-house-card>
<script src="preview.js"></script>
<script src="../energy-house-card.js"></script>
<script>
const q = new URLSearchParams(location.search);
const o = { ...PLAYGROUND_DEFAULTS, solar: q.get("solar") || "both", heatPump: q.get("pump") !== "false", time: q.get("time") || "day", car: q.get("car") || "sedan", battery: q.get("battery") || "wall", carColor: q.get("color") || "#ecebe6" };
const card = document.getElementById("c");
card.style.width = (q.get("w") || 760) + "px";
card.setConfig({ ...buildPlaygroundConfig(o), animate: false, ...(q.get("layout") && { layout: q.get("layout") }) });
card.hass = buildPlaygroundHass(o);
document.title = Math.ceil(card.getBoundingClientRect().height);
</script></body></html>
